rgbd_odometry:
  ros__parameters:
    frame_id: trunk
    odom_frame_id: odom
    publish_tf: false          # TF публикует EKF

    subscribe_depth: true
    subscribe_rgb: true
    subscribe_imu: false

    approx_sync: true
    queue_size: 10
    qos: 2                     # SENSOR_DATA (best effort)

    rgb_topic: /camera/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/camera_info

    # CPU-оптимизация
    Odom/Strategy: "0"         # Frame-to-Map
    Odom/FeatureType: "2"      # FAST (быстрее ORB)
    Odom/DetectorStrategy: "2"
    Odom/MaxFeatures: "500"
    Odom/MinInliers: "20"
    Odom/ResetCountdown: "1"